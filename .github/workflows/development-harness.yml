name: Development harness

on:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test harness (no install or network calls)
        run: node --test scripts/harness/check-scope.test.mjs
      - name: Check Othello scope when applicable
        env:
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/harness/check-scope.mjs --policy .harness/othello.json --base "$HARNESS_BASE_SHA" --auto
